    <script src="blog.js?v=3"></script>
    <script>
    (function () {
        var b = window.blog, main = document.getElementById('lista');
        var slug = new URLSearchParams(location.search).get('a') || '';
        function naoAchei() { main.textContent = ''; main.appendChild(b.el('p', { text: 'Assunto não encontrado.' })); main.appendChild(b.el('a', { class: 'blog-voltar', href: 'index.html', text: '← Ver todos os textos' })); }
        b.buscar('publicado=eq.true&select=slug,titulo,assunto,imagem_url,publicado_em&order=publicado_em.desc').then(function (posts) {
            var a = b.agruparAssuntos(posts).filter(function (x) { return x.slug === slug; })[0];
            if (!a) { naoAchei(); return; }
            document.title = a.nome + ' | Cássio Pereira';
            main.textContent = '';
            main.appendChild(b.el('h1', { class: 'pagina', text: a.nome }));
            var grade = b.el('div', { class: 'postagens' });
            a.posts.forEach(function (p) { grade.appendChild(b.cartao(p)); });
            main.appendChild(grade);
            main.appendChild(b.el('a', { class: 'blog-voltar', href: 'index.html', text: '← Ver todos os textos' }));
        }).catch(naoAchei);
    })();
    </script>
